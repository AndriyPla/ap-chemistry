<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Potential energy curves for bonds A and B</title>
  <desc id="desc">Curve B has a minimum near 120 picometers and negative 600 kilojoules per mole. Curve A has a minimum near 180 picometers and negative 350 kilojoules per mole. Both approach zero at large separation.</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Potential Energy vs. Internuclear Distance</text>
  <line x1="90" y1="55" x2="90" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="370" x2="720" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="105" x2="720" y2="105" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="76" y="110" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#374151">0</text>
  <text x="76" y="255" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#374151">−350</text>
  <text x="76" y="335" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#374151">−600</text>
  <line x1="84" y1="250" x2="96" y2="250" stroke="#111827"/>
  <line x1="84" y1="330" x2="96" y2="330" stroke="#111827"/>
  <text x="405" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#111827">Internuclear distance (pm)</text>
  <text x="22" y="220" text-anchor="middle" transform="rotate(-90 22 220)" font-family="Arial, sans-serif" font-size="15" fill="#111827">Potential energy (kJ mol⁻¹)</text>
  <text x="190" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">120</text>
  <text x="290" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">180</text>
  <line x1="190" y1="364" x2="190" y2="376" stroke="#111827"/>
  <line x1="290" y1="364" x2="290" y2="376" stroke="#111827"/>
  <path d="M115 62 C135 70 150 245 180 320 C190 342 206 331 225 285 C265 190 350 125 700 108" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M145 62 C175 95 225 210 275 245 C290 256 310 250 330 228 C390 165 500 120 700 108" fill="none" stroke="#dc2626" stroke-width="4"/>
  <circle cx="194" cy="330" r="5" fill="#2563eb"/>
  <circle cx="292" cy="250" r="5" fill="#dc2626"/>
  <line x1="194" y1="330" x2="194" y2="370" stroke="#2563eb" stroke-dasharray="4 4"/>
  <line x1="292" y1="250" x2="292" y2="370" stroke="#dc2626" stroke-dasharray="4 4"/>
  <text x="220" y="316" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">Bond B</text>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626">Bond A</text>
  <text x="565" y="92" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">separated atoms</text>
</svg>
